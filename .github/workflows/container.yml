name: Publish container image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/container.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: logo-market-place-container
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/beyondmarks-ai/logo-market-place-api

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: docker build --label "org.opencontainers.image.revision=${{ github.sha }}" -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Push image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "/users/${{ github.repository_owner }}/packages/container/logo-market-place-api" -f visibility=public
